services:
  mysql:
    image: mysql:8.0
    container_name: mysql
    environment:
      MYSQL_ROOT_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
      MYSQL_ALLOW_EMPTY_PASSWORD: "no"
      MYSQL_DATABASE: bizflow_db
    ports:
      - "3306:3306"
    volumes:
      - mysql_data:/var/lib/mysql

  redis:
    image: redis:alpine
    container_name: redis
    ports:
      - "6379:6379"

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: phpmyadmin
    depends_on:
      - mysql
    environment:
      PMA_HOST: mysql
      PMA_USER: root
      PMA_PASSWORD: ${MYSQL_ROOT_PASSWORD:-root}
    ports:
      - "8080:80"

  backend:
    build: .
    container_name: bizflow_backend
    depends_on:
      - mysql
      - redis
    env_file:
      - .env
    environment:
      - DATABASE_URI=mysql+pymysql://root:${MYSQL_ROOT_PASSWORD:-root}@mysql:3306/bizflow_db
    ports:
      - "6868:6868"
    volumes:
      - .:/app

volumes:
  mysql_data:
